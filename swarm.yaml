project:
  name: bmad-swarm
  description: adding the brainstorming features to the existing bmad-swarm
  type: web-app
stack:
  language: JavaScript
methodology:
  autonomy: auto
  phases:
    ideation:
      enabled: true
    exploration:
      enabled: true
    definition:
      enabled: true
    design:
      enabled: true
    implementation:
      enabled: true
      parallel_devs: 2
    delivery:
      enabled: true
  quality:
    require_tests: true
    require_review: true
    require_human_approval:
      - prd
      - architecture
defaults:
  # D-027 (supersedes D-023's tiered overrides for this repo): everything on
  # fable while Claude Fable 5 is available — human directive 2026-06-09; this
  # account is on a subscription plan, so the 2× API cost does not apply.
  model: fable
output:
  artifacts_dir: ./artifacts
  code_dir: .
