project:
  name: bmad-swarm
  description: adding the brainstorming features to the existing bmad-swarm
  type: web-app
stack:
  language: JavaScript
methodology:
  autonomy: auto
  phases:
    ideation:
      enabled: true
    exploration:
      enabled: true
    definition:
      enabled: true
    design:
      enabled: true
    implementation:
      enabled: true
      parallel_devs: 2
    delivery:
      enabled: true
  quality:
    require_tests: true
    require_review: true
    require_human_approval:
      - prd
      - architecture
defaults:
  # D-048 (supersedes D-027): tier mix per ADR-023 (Fork B). D-027's
  # fable-everywhere burned the subscription usage limit ~2x on token-heavy
  # roles (human hit the cap 2026-08-12, killing a reviewer mid-pass) — live
  # confirmation of the economics finding. Default opus; fable reserved for
  # deep-reasoning low-volume roles + complexity >=12; sonnet for token-light
  # research/ops. Override per task via the Agent spawn's model field.
  model: opus
agents:
  architect:
    model: fable
  strategist:
    model: fable
  security:
    model: fable
  researcher:
    model: sonnet
  devops:
    model: sonnet
output:
  artifacts_dir: ./artifacts
  code_dir: .
# Replay gate (ADR-022 / D-049). The deterministic Tier-0 evidence engine
# (.claude/bmad/bin/replay-check.cjs) re-runs a gated task's declared evidence
# before its completion is accepted. It executes ONLY commands whose text
# prefix-matches allowed_commands — no agent-invented command is ever run (the
# L-2 answer). Everything else (stat'ing cited paths, resolving file citations,
# fixture-provenance) needs no allow-list. Widen allowed_commands to your runner.
replay:
  allowed_commands:
    - npm test
    - npm run test
    - node --test
  timeout_seconds: 300
  url_citations: advisory        # advisory | skip
  gated_task_classes:
    - story
    - bug-fix
    - review
  # Owner names (the completing teammate) that must produce gated work — the
  # coverage signal the completing agent cannot rename around.
  gated_owner_pattern: "^(dev|reviewer|security)"
